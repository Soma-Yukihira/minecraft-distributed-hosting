[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mdh-shared"
version = "0.13.1"
description = "Minecraft Distributed Hosting - shared models, protocol and sync primitives"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["mdh_shared*"]
