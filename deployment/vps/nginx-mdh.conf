# Minecraft Distributed Hosting: HTTPS entry of the control plane (REST API and WebSockets).
# Installed by install.sh as /etc/nginx/sites-available/mdh (+ link in sites-enabled).
#
# * Port 8443: 443 and 8080 belong to Pi-hole, which this site leaves alone.
# * Self-signed certificate for the IP address (no domain name): clients pin its SHA-256, given
#   with the address (https://IP:8443#pin), so no certificate authority is involved.
# * Only /api/ is forwarded, to the loopback-only API; everything else is 404.

map $http_upgrade $mdh_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/mdh/tls/cert.pem;
    ssl_certificate_key /etc/mdh/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:mdh_tls:1m;
    ssl_session_timeout 1h;

    # The API caps bodies at 16 MiB itself; this stops bigger ones before they reach it.
    client_max_body_size 17m;

    access_log /var/log/nginx/mdh.access.log;
    error_log  /var/log/nginx/mdh.error.log warn;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API trusts X-Real-IP from 127.0.0.1 only (rate limits per player IP).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mdh_connection_upgrade;
        # Control sessions send a heartbeat every 10 s; relay tunnels carry Minecraft keep-alives.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream world blocks and relay traffic instead of spooling them to disk.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
